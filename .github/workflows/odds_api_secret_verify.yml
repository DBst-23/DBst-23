name: Verify Odds API secret presence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Print presence and length only
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          python3 - <<'PY'
          import os
          key = os.environ.get('ODDS_API_KEY', '')
          print(f'ODDS_API_KEY present: {bool(key)}')
          print(f'ODDS_API_KEY length: {len(key)}')
          if not key:
              raise SystemExit('ODDS_API_KEY is missing')
          PY
