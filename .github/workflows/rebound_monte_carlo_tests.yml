name: Rebound Monte Carlo Tests
on:
  pull_request:
    paths:
      - "modules/rebound_monte_carlo.py"
      - "run_rebound_sim.py"
      - "tests/test_rebound_monte_carlo_lines.py"
      - ".github/workflows/rebound_monte_carlo_tests.yml"
  push:
    branches:
      - "sharpedge/rebound-line-probability-fix"
    paths:
      - "modules/rebound_monte_carlo.py"
      - "run_rebound_sim.py"
      - "tests/test_rebound_monte_carlo_lines.py"
      - ".github/workflows/rebound_monte_carlo_tests.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run rebound probability tests
        run: python -m unittest discover -s tests -p 'test_rebound_monte_carlo_lines.py' -v
