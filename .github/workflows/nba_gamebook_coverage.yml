name: Audit official NBA halftime source coverage

on:
  push:
    branches: [feature/nba-gamebook-coverage-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check PDF text utility
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Build API-NBA halftime outcome IDs and scores
        run: python3 scripts/api_sports_halftime_backfill.py --output-dir nba_halftime_artifact
      - name: Audit 10 official first-half game books per season
        run: |
          python3 scripts/audit_nba_gamebook_coverage.py \
            --dataset nba_halftime_artifact/halftime_outcomes.jsonl \
            --output nba_halftime_artifact/gamebook_coverage.json \
            --per-season 10
      - name: Upload compact coverage audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-gamebook-coverage
          path: nba_halftime_artifact/gamebook_coverage.json
          if-no-files-found: warn
          retention-days: 30
