name: Authenticated NBA Rebound Walk-Forward

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'run_authenticated_rebound_walk_forward.py'
      - 'modules/api_basketball_game_dates.py'
      - 'modules/rebound_walk_forward_backtest.py'
      - 'tests/test_rebound_backtest_v1_1.py'
      - 'modules/rebound_probability_calibration.py'
      - 'tests/test_rebound_calibration_v1_2.py'
      - '.github/workflows/authenticated_rebound_walk_forward.yml'

permissions:
  contents: read

jobs:
  authenticated-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Test walk-forward probabilities and leakage guard
        run: python -m unittest discover -s tests -p 'test_rebound_backtest_v1_1.py'
      - name: Test V1.2 chronological calibration and same-day isolation
        run: python -m unittest discover -s tests -p 'test_rebound_calibration_v1_2.py'
      - name: Run historical chronological backtest on authenticated NBA records
        env:
          APISPORTS_BASKETBALL_KEY: ${{ secrets.APISPORTS_BASKETBALL_KEY }}
          SHARPEDGE_MAX_GAMES: '180'
          SHARPEDGE_TARGET_PREDICTIONS: '200'
        run: python run_authenticated_rebound_walk_forward.py
      - name: Evaluate V1.2 prequential calibration
        run: python -m modules.rebound_probability_calibration --input authenticated_rebound_walk_forward.json --output rebound_calibration_v1_2.json
      - name: Upload verified dated records and backtest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: authenticated-nba-rebound-walk-forward
          path: |
            verified_nba_rebound_records.json
            authenticated_rebound_walk_forward.json
            rebound_calibration_v1_2.json
          if-no-files-found: ignore
