name: SharpEdge API-Basketball Connection Test

on:
  workflow_dispatch:
    inputs:
      game_id:
        description: 'Optional API-Basketball game ID; leave blank to discover NBA games'
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout connector branch
        uses: actions/checkout@v4
        with:
          ref: feature/api-basketball-rebound-ingest
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify API secret exists
        env:
          APISPORTS_BASKETBALL_KEY: ${{ secrets.APISPORTS_BASKETBALL_KEY }}
        run: |
          if [ -z "$APISPORTS_BASKETBALL_KEY" ]; then
            echo "::error::APISPORTS_BASKETBALL_KEY is not configured"
            exit 1
          fi
          echo "API secret is configured (value not displayed)."
      - name: Discover games and validate player rebounds
        env:
          APISPORTS_BASKETBALL_KEY: ${{ secrets.APISPORTS_BASKETBALL_KEY }}
          GAME_ID: ${{ inputs.game_id }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.parse import urlencode
          from urllib.request import Request, urlopen
          from modules.api_basketball_rebounds import fetch_player_game_stats, normalize_player_rebounds

          def api_get(path, params):
              url = "https://v1.basketball.api-sports.io" + path + "?" + urlencode(params)
              req = Request(url, headers={"x-apisports-key": os.environ["APISPORTS_BASKETBALL_KEY"]})
              with urlopen(req, timeout=25) as response:
                  payload = json.load(response)
              if payload.get("errors"):
                  raise RuntimeError("API reported an error: " + str(payload["errors"]))
              return payload.get("response", [])

          game_id = os.environ.get("GAME_ID", "").strip()
          if game_id:
              ids = [int(game_id)]
              print("Checking supplied API-Basketball game ID.")
          else:
              ids = []
              for season in ("2024-2025", "2023-2024"):
                  games = api_get("/games", {"league": 12, "season": season})
                  print(f"NBA league 12 season {season}: {len(games)} games returned")
                  ids = [g["id"] for g in reversed(games) if isinstance(g, dict) and isinstance(g.get("id"), int)]
                  if ids:
                      break
              if not ids:
                  raise SystemExit("No games returned. Check NBA league ID and season coverage.")
          for candidate in ids[:12]:
              payload = fetch_player_game_stats(game_id=candidate)
              rows = normalize_player_rebounds(payload)
              print(f"Game {candidate}: raw rows={len(payload['response'])}; normalized rebounds={len(rows)}")
              if rows:
                  print("PASS: Retrieved authenticated API-Basketball player rebounds.")
                  break
          else:
              raise SystemExit("API access worked, but no usable player rebound records were found; check endpoint coverage and response schema.")
          PY
