name: Audit official NBA first-half game books across seasons

on:
  push:
    branches: [diagnostics/nba-gamebook-seasons-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Check PDF text utility
        run: command -v pdftotext || (sudo apt-get update -qq && sudo apt-get install -y poppler-utils)
      - name: Compare 2022, 2023, and 2024 first-half pages
        run: python3 scripts/audit_nba_gamebook_seasons.py
      - name: Upload compact audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: official-nba-gamebook-season-audit
          path: diagnostics/nba_gamebook_season_audit.json
          if-no-files-found: warn
          retention-days: 14
