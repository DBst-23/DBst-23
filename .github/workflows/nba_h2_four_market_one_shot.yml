name: NBA H2 FOUR-market one-shot William Hill research (MANUAL ONLY)
on:
  workflow_dispatch:
    inputs:
      phase:
        description: "preflight is free; probe makes ONE paid request, maximum 4 credits"
        type: choice
        required: true
        default: preflight
        options: [preflight, probe]
      event_id:
        description: "Copy provider event ID from successful free preflight (required for probe)"
        type: string
        required: false
      confirmation:
        description: "For probe ONLY: type AUTHORIZE_FOUR_CREDITS_HALFTIME after confirming actual halftime"
        type: string
        required: false
permissions:
  contents: read
concurrency:
  group: sharpedge-nba-h2-four-market-SINGLE-LIFETIME-PILOT
  cancel-in-progress: false
jobs:
  one-shot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: odds-ledger-test
    steps:
      - name: Fail closed except on main
        run: |
          test "$GITHUB_REF" = "refs/heads/main" || { echo "Wrong branch; no provider requests"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run offline no-network tests before any credentials
        run: |
          python -m py_compile scripts/odds/nba_h2_four_market_probe.py tests/test_nba_h2_four_market_probe.py
          python -m unittest discover -s tests -p 'test_nba_h2_four_market_probe.py' -v
      - name: Install PostgreSQL driver (only for user-authorized probe)
        if: ${{ inputs.phase == 'probe' }}
        run: python -m pip install 'psycopg[binary]>=3.1,<4'
      - name: Free event preflight OR one bounded four-market request
        shell: bash
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          SHARPEDGE_ODDS_POSTGRES_DSN: ${{ secrets.SHARPEDGE_ODDS_POSTGRES_DSN }}
          PROBE_PHASE: ${{ inputs.phase }}
          PROBE_EVENT_ID: ${{ inputs.event_id }}
          PROBE_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          python scripts/odds/nba_h2_four_market_probe.py \
            --phase "$PROBE_PHASE" \
            --event-id "$PROBE_EVENT_ID" \
            --confirmation "$PROBE_CONFIRMATION"
