name: NBA one-game SportsDataIO diagnostic (isolated)
on:
  workflow_dispatch:
    inputs:
      game_id:
        description: "SportsDataIO numeric NBA GameID (verify separately)"
        required: true
        default: "14620"
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Probe one game only
        env:
          SPORTSDATAIO_API_KEY: ${{ secrets.SPORTSDATAIO_API_KEY }}
          GAME_ID: ${{ inputs.game_id }}
        run: |
          python analytics/liveflow_master/diagnose_sportsdataio_game.py --game-id "$GAME_ID" --audit artifacts/nba_one_game_diagnostic.json
      - name: Upload audit (including failed probes)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nba-one-game-diagnostic
          path: artifacts/nba_one_game_diagnostic.json
          if-no-files-found: warn
