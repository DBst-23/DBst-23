name: API-Sports NBA season access diagnostic

on:
  push:
    branches: [diagnostics/api-sports-nba-integrity-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - name: Check league, seasons, season feed, and a finished game
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          key = os.environ.get("API_SPORTS_KEY", "")
          report = {"provider": "API-Sports API-NBA v2",
                    "queries": {}, "sample_finished_game": None,
                    "team_statistics": None, "safe_for_training": False}

          def query(label, path, params=None):
              url = "https://v2.nba.api-sports.io/" + path
              if params:
                  url += "?" + urllib.parse.urlencode(params)
              request = urllib.request.Request(
                  url, headers={"x-apisports-key": key})
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      data = json.load(response)
                      status = response.status
                  games = data.get("response") or []
                  report["queries"][label] = {
                      "path": path, "parameters": params or {},
                      "http_status": status, "errors": data.get("errors") or {},
                      "results": data.get("results"),
                      "sample_values": (
                          games[:5] if label in ("leagues", "seasons")
                          else None),
                  }
                  return games
              except urllib.error.HTTPError as exc:
                  report["queries"][label] = {
                      "path": path, "parameters": params or {},
                      "http_status": exc.code, "error": "HTTP_ERROR"}
              except Exception as exc:
                  report["queries"][label] = {
                      "path": path, "parameters": params or {},
                      "error": type(exc).__name__}
              return []

          if not key:
              report["status"] = "MISSING_SECRET"
          else:
              query("leagues", "leagues")
              query("seasons", "seasons")
              query("season_2025", "games",
                    {"league": "standard", "season": "2025"})
              for season in ("2022", "2023"):
                  older = query("season_" + season, "games",
                                {"league": "standard", "season": season})
                  report["queries"]["season_" + season]["finished_count"] = sum(
                      str((g.get("status") or {}).get("short")) == "3"
                      for g in older if isinstance(g, dict))
              historical = query("season_2024", "games",
                                 {"league": "standard", "season": "2024"})
              report["queries"]["season_2024"]["finished_count"] = sum(
                  str((g.get("status") or {}).get("short")) == "3"
                  for g in historical if isinstance(g, dict))
              from collections import Counter
              stages = Counter(str(g.get("stage")) for g in historical
                               if isinstance(g, dict))
              report["queries"]["season_2024"]["stages"] = dict(stages)
              audit = {"finished": 0, "halftime_scores_complete": 0,
                       "quarter_sum_matches_final": 0,
                       "quarter_sum_mismatch": 0,
                       "missing_quarters": 0, "examples_by_stage": {}}
              for game in historical:
                  if not isinstance(game, dict):
                      continue
                  stage = str(game.get("stage"))
                  if stage not in audit["examples_by_stage"]:
                      audit["examples_by_stage"][stage] = {
                          "id": game.get("id"),
                          "date": (game.get("date") or {}).get("start"),
                          "status": (game.get("status") or {}).get("short")}
                  if str((game.get("status") or {}).get("short")) != "3":
                      continue
                  audit["finished"] += 1
                  scores = game.get("scores") or {}
                  halves = []
                  totals_ok = []
                  for side in ("home", "visitors"):
                      score = scores.get(side) or {}
                      lines = score.get("linescore") or []
                      try:
                          quarters = [int(x) for x in lines]
                          halves.append(len(quarters) >= 2 and
                                        all(x >= 0 for x in quarters[:2]))
                          totals_ok.append(sum(quarters) == int(score["points"]))
                      except (ValueError, TypeError, KeyError):
                          halves.append(False)
                          totals_ok.append(False)
                  if all(halves):
                      audit["halftime_scores_complete"] += 1
                  else:
                      audit["missing_quarters"] += 1
                  if all(totals_ok):
                      audit["quarter_sum_matches_final"] += 1
                  else:
                      audit["quarter_sum_mismatch"] += 1
              report["season_2024_audit"] = audit
              finished = next(
                  (g for g in historical if isinstance(g, dict)
                   and str((g.get("status") or {}).get("short")) == "3"),
                  None)
              if finished:
                  report["sample_finished_game"] = {
                      "id": finished.get("id"),
                      "date": finished.get("date"),
                      "league": finished.get("league"),
                      "season": finished.get("season"),
                      "stage": finished.get("stage"),
                      "status": finished.get("status"),
                      "teams": finished.get("teams"),
                      "scores": finished.get("scores"),
                      "periods": finished.get("periods"),
                  }
                  stats = query("sample_team_stats", "games/statistics",
                                {"id": finished["id"]})
                  report["team_statistics"] = stats[:2]
              report["status"] = (
                  "HISTORICAL_SEASON_ACCESSIBLE" if finished else
                  "HISTORICAL_SEASON_RESTRICTED_OR_EMPTY")
              report["note"] = (
                  "Finished quarter scores can reconstruct halftime score; "
                  "final game statistics are not halftime snapshots, and "
                  "halftime odds require separately timestamped data.")
          Path("diagnostics").mkdir(exist_ok=True)
          Path("diagnostics/api_sports_nba_season.json").write_text(
              json.dumps(report, indent=2, default=str) + "\n")
          print(json.dumps({
              "status": report["status"],
              "season_results": report["queries"].get("season_2024", {}).get("results"),
              "season_errors": report["queries"].get("season_2024", {}).get("errors"),
              "sample_finished_id": (report["sample_finished_game"] or {}).get("id"),
              "safe_for_training": False}))
          if not key:
              raise SystemExit(2)
          PY
      - name: Upload isolated diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-sports-nba-season
          path: diagnostics/api_sports_nba_season.json
          if-no-files-found: warn
          retention-days: 14
