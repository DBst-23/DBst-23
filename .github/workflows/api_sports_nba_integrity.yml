name: API-Sports NBA access diagnostic

on:
  push:
    branches: [diagnostics/api-sports-nba-integrity-20261112]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      API_SPORTS_KEY: ${{ secrets.API_SPORTS_KEY }}
    steps:
      - name: Check historical entitlement and current slate
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request
          from pathlib import Path

          report = {
              "provider": "API-Sports API-NBA v2",
              "historical_date": "2025-12-25",
              "current_date": "2026-11-13",
              "date_note": "UTC API date for US evening November 12 slate",
              "historical": None,
              "current": None,
              "safe_for_training": False,
          }
          key = os.environ.get("API_SPORTS_KEY", "")
          if not key:
              report["status"] = "MISSING_SECRET"
          else:
              def query(date):
                  req = urllib.request.Request(
                      f"https://v2.nba.api-sports.io/games?date={date}",
                      headers={"x-apisports-key": key},
                  )
                  try:
                      with urllib.request.urlopen(req, timeout=25) as resp:
                          payload = json.load(resp)
                          code = resp.status
                      errors = payload.get("errors") or {}
                      games = payload.get("response") or []
                      return {
                          "http_status": code,
                          "errors": errors,
                          "results": payload.get("results"),
                          "games": [
                              {
                                  "id": g.get("id"),
                                  "home": (g.get("teams") or {}).get("home", {}).get("name"),
                                  "away": (g.get("teams") or {}).get("visitors", {}).get("name"),
                                  "status": g.get("status"),
                                  "home_points": ((g.get("scores") or {}).get("home") or {}).get("points"),
                                  "away_points": ((g.get("scores") or {}).get("visitors") or {}).get("points"),
                              }
                              for g in games if isinstance(g, dict)
                          ],
                      }
                  except urllib.error.HTTPError as exc:
                      return {"http_status": exc.code, "error": "HTTP_ERROR"}
                  except Exception as exc:
                      return {"error": type(exc).__name__}
              report["historical"] = query(report["historical_date"])
              report["current"] = query(report["current_date"])
              report["status"] = (
                  "CURRENT_SLATE_ACCESSIBLE"
                  if report["current"].get("games") and not report["current"].get("errors")
                  else "CURRENT_SLATE_UNAVAILABLE"
              )
          Path("diagnostics").mkdir(exist_ok=True)
          Path("diagnostics/api_sports_nba_integrity.json").write_text(
              json.dumps(report, indent=2, default=str) + "\n"
          )
          print(json.dumps({
              "status": report["status"],
              "historical_errors": (report["historical"] or {}).get("errors"),
              "current_results": (report["current"] or {}).get("results"),
              "safe_for_training": False,
          }))
          if report["status"] != "CURRENT_SLATE_ACCESSIBLE":
              raise SystemExit(2)
          PY
      - name: Upload isolated report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-sports-nba-integrity
          path: diagnostics/api_sports_nba_integrity.json
          if-no-files-found: warn
          retention-days: 14
